{% extends 'layout.html' %}

{% block content %}
<style>
  body {
    font-family: Arial, sans-serif;
    background: #eaf7ff;
  }
  .container {
    display: flex;
    width: 100%;
    min-height: calc(100vh - 70px); /* leaves space for navbar */
    margin-top: 70px; /* pushes content below navbar */
  }
  .left-side {
    flex: 1;
    background: #d6efff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    color: #003366;
  }
  .left-side h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }
  .left-side p {
    font-size: 1.1rem;
    line-height: 1.6;
  }
  .right-side {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fcff;
  }
  .register-card {
    background: #0a369d;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
    width: 80%;
    max-width: 500px;
    text-align: center;
    color: white;
  }
  .register-card h2 {
    margin-bottom: 20px;
    font-size: 1.5rem;
  }
  .register-card input,
  .register-card select,
  .register-card textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 6px;
    border: none;
    outline: none;
    font-size: 1rem;
  }
  .register-card button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    background: #ffffff;
    color: #0a369d;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .register-card button:hover {
    background: #e0e0e0;
  }
  .register-card a {
    display: inline-block;
    margin-top: 15px;
    font-size: 0.9rem;
    color: #ddd;
    text-decoration: none;
  }
  .register-card a:hover { text-decoration: underline; }
  @media (max-width: 768px) {
    .container { flex-direction: column; margin-top: 60px; }
    .left-side, .right-side {
      flex: none; width: 100%; height: auto; padding: 20px;
    }
    .register-card { width: 95%; }
  }
</style>

<div class="container">
  <!-- Left side -->
  <div class="left-side">
    <h1>Welcome Patient</h1>
    <p>Create your account to book appointments, manage health records, and access hospital services easily.</p>
  </div>

  <!-- Right side -->
  <div class="right-side">
    <div class="register-card">
      <h2>Patient Registration</h2>

      <!-- Registration Form -->
      <form method="POST" action="{{ url_for('register_patient') }}">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="number" name="age" placeholder="Age" min="0" max="120" required>
        <input type="date" name="dob" required>
        
        <select name="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <input type="tel" name="mobile" placeholder="10-digit Mobile Number" 
               pattern="[0-9]{10}" minlength="10" maxlength="10" required>

        <select name="blood_group" required>
          <option value="">Select Blood Group</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>O+</option><option>O-</option>
          <option>AB+</option><option>AB-</option>
        </select>

        <textarea name="address" rows="3" placeholder="Full Address" required></textarea>

        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Register</button>
      </form>

      <a href="{{ url_for('index') }}">← Back</a>
    </div>
  </div>
</div>
{% endblock %}
