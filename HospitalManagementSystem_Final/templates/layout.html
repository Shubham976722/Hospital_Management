<!-- templates/layout.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hospital Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>


  <!-- Top Contact Bar -->
  <div class="top-bar">
    <div class="left">
      📞 <a href="tel:+919876543210">+91-9876543210</a>
    </div>
    <div class="right">
      ✉ <a href="mailto:contact@hospital.com?subject=Appointment Inquiry&body=Hello, I want to book an appointment.">
        contact@hospital.com
      </a>
    </div>
  </div>

  <!-- Main Page Wrapper -->
  <div class="page-wrapper">

    <!-- Main Page Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer class="footer-strip">
      🏥 <a
        href="https://www.google.com/maps/place/Warkad+Hospital/@19.854072,75.8866978,1816m/data=!3m1!1e3!4m6!3m5!1s0x3bda50ad54e5932d:0x3952879cfa2c5891!8m2!3d19.8587013!4d75.8884777!16s%2Fg%2F1hg4t21j7?entry=ttu&g_ep=EgoyMDI1MDcxMy4wIKXMDSoASAFQAw%3D%3D"
        target="_blank" style="color: inherit; text-decoration: none;">
        Jai Shankar Nagar, Shree Krishna Nagar, Jalna, Maharashtra 431203
      </a>
    </footer>

  </div>

  <body class="{% if request.endpoint != 'index' %}with-background{% endif %}">
    
</body>
</body>

</html>
