
<!-- templates/login.html -->
{% extends 'layout.html' %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg p-4" style="max-width: 420px; width: 100%;">
    <h2 class="text-center mb-4">Login</h2>

    <!-- Tabs for role selection -->
    <ul class="nav nav-tabs mb-3" id="roleTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab">Admin</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="doctor-tab" data-bs-toggle="tab" data-bs-target="#doctor" type="button" role="tab">Doctor</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="patient-tab" data-bs-toggle="tab" data-bs-target="#patient" type="button" role="tab">Patient</button>
      </li>
    </ul>

    <!-- Tab contents -->
    <div class="tab-content" id="roleTabsContent">

      <!-- Admin Login -->
      <div class="tab-pane fade show active" id="admin" role="tabpanel">
        <form method="POST" action="{{ url_for('login_admin') }}">
          <div class="mb-3">
            <label for="admin-username" class="form-label">Username</label>
            <input type="text" class="form-control" id="admin-username" name="username" placeholder="Enter username" required>
          </div>
          <div class="mb-3">
            <label for="admin-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="admin-password" name="password" placeholder="Enter password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>
      </div>

      <!-- Doctor Login -->
      <div class="tab-pane fade" id="doctor" role="tabpanel">
        <form method="POST" action="{{ url_for('login_doctor') }}">
          <div class="mb-3">
            <label for="doctor-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="doctor-email" name="email" placeholder="Enter email" required>
          </div>
          <div class="mb-3">
            <label for="doctor-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="doctor-password" name="password" placeholder="Enter password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>
      </div>

      <!-- Patient Login -->
      <div class="tab-pane fade" id="patient" role="tabpanel">
        <form method="POST" action="{{ url_for('login_patient') }}">
          <div class="mb-3">
            <label for="patient-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="patient-email" name="email" placeholder="Enter email" required>
          </div>
          <div class="mb-3">
            <label for="patient-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="patient-password" name="password" placeholder="Enter password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
