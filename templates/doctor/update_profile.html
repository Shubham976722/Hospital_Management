{% extends "layout.html" %}

{% block content %}
<style>
  .container {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 90vh;
  }

  .left-side {
    flex: 1;
    background: #d6efff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    color: #003366;
  }

  .left-side h1 {
    font-size: 2rem;
    margin-bottom: 15px;
  }

  .left-side p {
    font-size: 1.05rem;
  }

  .right-side {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fcff;
  }

  .form-card {
    background: #0a369d;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    width: 75%;
    max-width: 450px;
    color: white;
  }

  .form-card h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .form-card label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
  }

  .form-card input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    margin-bottom: 10px;
    outline: none;
  }

  .form-card button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #ffffff;
    color: #0a369d;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }

  .form-card button:hover {
    background: #e0e0e0;
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    text-decoration: none;
    color: #ddd;
  }

  .back-link:hover {
    text-decoration: underline;
  }
</style>

<div class="container">

  <!-- Left text -->
  <div class="left-side">
    <h1>Update Profile</h1>
    <p>Keep your details accurate so patients and admins don’t get confused.</p>
  </div>

  <!-- Right form -->
  <div class="right-side">
    <div class="form-card">
      <h2>Edit Details</h2>

      <form method="POST">
        <label>Name</label>
        <input type="text" name="name" value="{{ doctor['name'] }}" required>

        <label>Specialization</label>
        <input type="text" name="specialization" value="{{ doctor['specialization'] }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ doctor['email'] }}" required>

        <button type="submit">Update Profile</button>
      </form>

      <a class="back-link" href="{{ url_for('doctor_dashboard') }}">← Back to Dashboard</a>
    </div>
  </div>

</div>
{% endblock %}
