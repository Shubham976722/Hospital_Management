{% extends "layout.html" %}

{% block title %}Update Doctor Profile | MedCare+ Clinician{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-container" style="max-width: 800px; grid-template-columns: 1fr;">
    <div class="auth-main" style="padding: 2.5rem;">
      <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.35rem; background: linear-gradient(135deg, #0284c7, #064e3b);">
          <i class="fa fa-user-pen"></i>
        </div>
        <h1 class="auth-title">Update Doctor Profile</h1>
        <p class="auth-subtitle">Ensure your contact and specialization details are up-to-date.</p>
      </div>

      <form method="POST">
        <div class="form-group">
          <label class="form-label" for="name">Doctor Full Name</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-user-doctor input-icon"></i>
            <input type="text" id="name" name="name" class="form-control" value="{{ doctor['name'] }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="specialization">Medical Specialization / Department</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-stethoscope input-icon"></i>
            <input type="text" id="specialization" name="specialization" class="form-control" value="{{ doctor['specialization'] }}" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Official Hospital Email</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-envelope input-icon"></i>
            <input type="email" id="email" name="email" class="form-control" value="{{ doctor['email'] }}" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fa fa-floppy-disk"></i> Save Updated Profile
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border); padding-top: 1rem;">
        <a href="{{ url_for('doctor_dashboard') }}" style="font-size: 0.85rem; color: var(--primary); font-weight: 700;">
          <i class="fa fa-arrow-left"></i> Back to Doctor Desk
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
